<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Lucas Moura</title>
  <desc id="desc">Banner em estilo terminal: Lucas Moura, low-level, embedded e segurança aplicada.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00A32A" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" fill-opacity="0.02"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00A32A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00A32A" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#00A32A" stop-opacity="0"/>
    </linearGradient>

    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,monospace; }
      .name { fill:#0A0A0A; font-size:72px; font-weight:700; letter-spacing:6px; }
      .ghost-a { fill:#00A32A; opacity:.22; }
      .ghost-b { fill:#FF2E88; opacity:.18; }
      .sub { fill:#4A5568; font-size:20px; letter-spacing:3px; }
      .dim { fill:#00A32A; font-size:14px; letter-spacing:2px; opacity:.95; }
      .prompt { fill:#00A32A; font-size:18px; }
      .cursor { fill:#00A32A; }

      @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
      .cursor { animation: blink 1.1s steps(1,end) infinite; }

      @keyframes glitch {
        0%, 90%, 100% { transform: translate(0,0); }
        91% { transform: translate(-3px,1px); }
        92% { transform: translate(3px,-1px); }
        93% { transform: translate(-2px,-1px); }
        94% { transform: translate(2px,1px); }
        95% { transform: translate(0,0); }
      }
      .glitch { animation: glitch 6s infinite; }
    </style>
  </defs>

  <rect width="1280" height="320" fill="#FFFFFF"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#scan)"/>
  <rect width="1280" height="320" fill="url(#vig)"/>

  <g fill="none" stroke="#00A32A" stroke-width="2" stroke-opacity="0.9">
    <path d="M24 56 V24 H56"/>
    <path d="M1256 56 V24 H1224"/>
    <path d="M24 264 V296 H56"/>
    <path d="M1256 264 V296 H1224"/>
  </g>

  <text x="56" y="44" class="mono dim">[ SYS::PROFILE ]</text>
  <text x="1224" y="44" text-anchor="end" class="mono dim">NODE // BRASILIA-DF</text>
  <rect x="56" y="64" width="1168" height="1" fill="url(#fade)"/>

  <g class="mono glitch">
    <text x="640" y="176" text-anchor="middle" class="name ghost-a" transform="translate(-2,0)">LUCAS MOURA</text>
    <text x="640" y="176" text-anchor="middle" class="name ghost-b" transform="translate(2,0)">LUCAS MOURA</text>
    <text x="640" y="176" text-anchor="middle" class="name">LUCAS MOURA</text>
  </g>

  <text x="640" y="216" text-anchor="middle" class="mono sub">low-level · embedded · applied security</text>
  <rect x="56" y="248" width="1168" height="1" fill="url(#fade)"/>

  <text x="56" y="288" class="mono prompt">luc@cyberdeck:~$ ./whoami</text>
  <rect x="300" y="273" width="11" height="18" class="cursor"/>
  <text x="1224" y="288" text-anchor="end" class="mono dim">[ OK ]</text>
</svg>
